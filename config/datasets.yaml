# Thesis dataset registry.
# Source of truth for what is downloaded, from where, and into which Drive folder.
# Matches the "Finalised Dataset Plan" (2026-10-19). PCAP captures are excluded
# everywhere: only flow/feature CSVs and logs are fetched, to stay inside the Drive budget.
#
# Source types (tried in order until one yields files):
#   drive_copy  - copy files that already exist elsewhere in your Drive
#   urls        - fixed list of direct file URLs
#   s3          - public S3 bucket listing (no AWS account needed)
#   http_index  - crawl an Apache-style directory listing, keep files matching `include`
#   kaggle      - Kaggle mirror (needs a Kaggle API token in Colab secrets)
#   manual      - you place the files yourself; the tool only verifies and checksums them
# A value of "gated:<key>" is read from gated_urls.yaml in Drive (links you get after
# filling in the provider's registration form). Keep that file out of git.

datasets:
  - id: cicids2017_improved
    name: CICIDS2017 (corrected labels, Engelen et al. 2021/2022)
    objectives: [1, 4]
    approx_gb: 1.2          # verified: 5 day CSVs already in Drive, 1.15 GB
    enabled: true
    sources:
      - type: drive_copy
        path: ids-adapt/data/raw/cicids2017      # relative to MyDrive
        include: '(?i)^(monday|tuesday|wednesday|thursday|friday)\.csv$'
        # Assumed to be the corrected release (that release ships monday.csv..friday.csv).
        # fetch.py warns if it lacks the extra "Attempted Category" column.
      - type: http_index
        url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/
        include: '(?i)ids.?2017.*\.(zip|csv|7z|tar\.gz)$'
    cite: >-
      Engelen, Rimmer, Joosen. Troubleshooting an Intrusion Detection Dataset: the
      CICIDS2017 Case Study. IEEE SPW/WTMC 2021.

  - id: csecicids2018_improved
    name: CSE-CIC-IDS2018 (corrected labels, Liu, Engelen et al. CNS 2022)
    objectives: [1, 3]
    approx_gb: null         # unknown until listed; run --plan first
    enabled: true
    sources:
      - type: http_index
        url: https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/
        include: '(?i)ids.?2018.*\.(zip|csv|7z|tar\.gz)$'
    cite: >-
      Liu, Engelen, Lynar, Essam, Joosen. Error Prevalence in NIDS datasets: A Case Study
      on CIC-IDS-2017 and CSE-CIC-IDS-2018. IEEE CNS 2022.

  - id: csecicids2018_original
    name: CSE-CIC-IDS2018 original CICFlowMeter CSVs (for label-correction comparison only)
    objectives: [1]
    approx_gb: 6.4          # verified from the bucket listing: 10 files
    enabled: false          # turn on only if you need the uncorrected baseline
    sources:
      - type: s3
        bucket: cse-cic-ids2018
        region: ca-central-1
        prefix: Processed Traffic Data for ML Algorithms/
        include: '\.csv$'

  - id: unsw_nb15
    name: UNSW-NB15 (CSV feature files)
    objectives: [1, 3]
    approx_gb: 0.7
    enabled: true
    sources:
      - type: manual
        instructions: >-
          Official files are in a UNSW SharePoint folder that cannot be scripted:
          https://unsw-my.sharepoint.com/:f:/g/personal/z5025758_ad_unsw_edu_au/EnuQZZn3XuNBjgfcUu4DIVMBLCHyoLHqOswirpOQifr1ag?e=gKWkLS
          Open "CSV Files", download UNSW-NB15_1..4.csv, NUSW-NB15_features.csv and the
          "Training and Testing Sets" folder, then upload them into this dataset's Drive folder.
      - type: kaggle
        slug: mrwellsdavid/unsw-nb15
        note: Community mirror; checksum against the official files if you use it.

  - id: ton_iot
    name: ToN_IoT (processed network, Linux, Windows and IoT telemetry CSVs)
    objectives: [3, 4]
    approx_gb: null
    enabled: true
    sources:
      - type: manual
        instructions: >-
          Official files are in a UNSW SharePoint folder:
          https://unsw-my.sharepoint.com/:f:/g/personal/z5025758_ad_unsw_edu_au/EvBTaetotpdGnW7rJQ8fCvYBh8063CNeY9W33MpRsarJaQ?e=yZlnxW
          Download "Processed_datasets", "Train_Test_datasets" and
          "SecurityEvents_GroundTruth_datasets" (skip the raw pcaps), then upload them
          into this dataset's Drive folder.

  - id: ciciot2023
    name: CIC-IoT2023 (CSV features)
    objectives: [1, 3]
    approx_gb: 13           # CSV.zip; kept zipped, extracted at preprocessing time
    enabled: true
    sources:
      - type: urls          # CSV/CSV.zip and CSV/README.pdf from cicresearch.ca after the UNB form
        urls: gated:ciciot2023_urls
      - type: manual        # fallback: CSV.zip downloaded in the browser and dropped into Drive
        instructions: >-
          Download CSV/CSV.zip and CSV/README.pdf from the cicresearch.ca browse page and drag them
          into this dataset's Drive folder.
    register: https://www.unb.ca/cic/datasets/iotdataset-2023.html

  - id: lanl_cyber1
    name: LANL Comprehensive, Multi-Source Cyber-Security Events
    objectives: [1, 4]
    approx_gb: 12           # official page: ~12 GB compressed; kept gzipped
    enabled: true
    sources:
      - type: urls
        urls: gated:lanl_cyber1_urls
    register: https://csr.lanl.gov/data/cyber1/
    cite: >-
      Kent, A. D. Comprehensive, Multi-Source Cyber-Security Events. Los Alamos National
      Laboratory, 2015. doi:10.17021/1179829

  - id: ciciomt2024
    name: CICIoMT2024 (WiFi and MQTT CSV features)
    objectives: [3]
    approx_gb: null
    enabled: true
    sources:
      - type: urls          # direct download links copied from the cicresearch.ca browse page
        urls: gated:ciciomt2024_urls
      - type: http_index
        url: gated:ciciomt2024_folder
        include: '(?i)/csv/.*\.csv$'
        exclude: '(?i)pcap'
    register: https://www.unb.ca/cic/datasets/iomt-dataset-2024.html

  - id: nsl_kdd
    name: NSL-KDD (baseline only)
    objectives: [1]
    approx_gb: 0.03
    enabled: true
    sources:
      - type: urls
        urls:
          - https://raw.githubusercontent.com/defcom17/NSL_KDD/master/KDDTrain%2B.txt
          - https://raw.githubusercontent.com/defcom17/NSL_KDD/master/KDDTest%2B.txt
          - https://raw.githubusercontent.com/defcom17/NSL_KDD/master/KDDTest-21.txt
          - https://raw.githubusercontent.com/defcom17/NSL_KDD/master/KDDTrain%2B_20Percent.txt
    note: GitHub mirror of the UNB files (the UNB page sits behind a form).

  # ---- Duplicates of data already in Drive from earlier work (copied, originals left in place)
  - id: edge_iiotset
    name: Edge-IIoTset (copy from ids-adapt; not in the finalised plan)
    objectives: []
    approx_gb: 8.4          # verified: 26 CSVs in ids-adapt/data/raw/edge_iiotset
    enabled: true
    sources:
      - type: drive_copy
        path: ids-adapt/data/raw/edge_iiotset
        include: '\.csv$'

  - id: ids_adapt_processed_legacy
    name: Processed parquet files from the ids-adapt project (provenance as recorded there)
    objectives: []
    approx_gb: 8.5          # verified: cse_cic_ids2018 8.1 GB, cicids2017 0.3 GB, unsw_nb15 0.1 GB
    enabled: true
    sources:
      - type: drive_copy
        path: ids-adapt/data/processed
        include: '\.parquet$'
    note: >-
      Built for an earlier paper, probably from the original (uncorrected) CIC releases.
      Kept for reference and comparison only; thesis experiments start from the raw folders.
