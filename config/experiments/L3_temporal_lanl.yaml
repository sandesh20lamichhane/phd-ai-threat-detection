name: L3_temporal_lanl
data: lanl_cyber1
split:
  type: by_time
  train_days: [1, 40]
  test_days: [41, 58]
  report: lead_time
preprocessing: {drop_identifiers: true, drop_duplicates: true, balance: none}  # balance only on train folds
models: [random_forest, xgboost, mlp, cnn_lstm, proposed]
metrics: [macro_f1, per_class_recall, pr_auc, fpr_at_tpr_0.95]
seeds: config/seeds.yaml
stats: {two_models: wilcoxon, many_models: friedman_nemenyi}
