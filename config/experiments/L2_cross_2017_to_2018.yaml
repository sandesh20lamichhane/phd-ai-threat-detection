name: L2_cross_2017_to_2018
data: cicids2017_improved -> csecicids2018_improved
task: binary                    # primary
split:
  type: cross_dataset
  source: {dataset: cicids2017_improved, split: primary, train: train, val: val, reference: test}
  target: {dataset: csecicids2018_improved, split: external}
  features: config/feature_mapping/cic_shared_features.yaml
preprocessing: {transform: frozen_on_source_train, attempted: exclude, conflicts: keep, ports: exclude, balance: none}
threshold: maximise_macro_f1_on_source_val   # never tuned on the target
models: [random_forest, xgboost, mlp, cnn_lstm, proposed]
metrics: [macro_f1, per_class_precision_recall_f1, balanced_accuracy, fpr, pr_auc, fpr_at_tpr_0.95]
seeds: config/seeds.yaml
stats: {estimand: "F1(source test) - F1(target)", ci: block_bootstrap, B: 10000, margin_X: 0.05,
        decision: three_outcome, multiplicity: holm, two_models: wilcoxon, many_models: friedman_nemenyi}
